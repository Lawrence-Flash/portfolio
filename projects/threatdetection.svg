<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#2d1354" />
      <stop offset="100%" stop-color="#120824" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#aiGrad)" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1.5"/>
  <!-- Neural Net Matrix -->
  <g transform="translate(60, 60)">
    <!-- Nodes and Connections -->
    <line x1="20" y1="40" x2="100" y2="20" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="40" x2="100" y2="60" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="40" x2="100" y2="100" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="80" x2="100" y2="20" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="80" x2="100" y2="60" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="80" x2="100" y2="100" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>

    <line x1="100" y1="20" x2="180" y2="30" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>
    <line x1="100" y1="60" x2="180" y2="30" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>
    <line x1="100" y1="60" x2="180" y2="90" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>
    <line x1="100" y1="100" x2="180" y2="90" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>

    <line x1="180" y1="30" x2="250" y2="60" stroke="#34d399" stroke-width="2" opacity="0.9"/>
    <line x1="180" y1="90" x2="250" y2="60" stroke="#34d399" stroke-width="2" opacity="0.9"/>

    <!-- Layer 1 -->
    <circle cx="20" cy="40" r="7" fill="#7e22ce" stroke="#c084fc" stroke-width="2"/>
    <circle cx="20" cy="80" r="7" fill="#7e22ce" stroke="#c084fc" stroke-width="2"/>

    <!-- Layer 2 -->
    <circle cx="100" cy="20" r="7" fill="#9333ea" stroke="#d8b4fe" stroke-width="2"/>
    <circle cx="100" cy="60" r="7" fill="#9333ea" stroke="#d8b4fe" stroke-width="2"/>
    <circle cx="100" cy="100" r="7" fill="#9333ea" stroke="#d8b4fe" stroke-width="2"/>

    <!-- Layer 3 -->
    <circle cx="180" cy="30" r="8" fill="#a855f7" stroke="#e9d5ff" stroke-width="2"/>
    <circle cx="180" cy="90" r="8" fill="#a855f7" stroke="#e9d5ff" stroke-width="2"/>

    <!-- Output Node / Shield Detected -->
    <circle cx="250" cy="60" r="12" fill="#10b981" stroke="#a7f3d0" stroke-width="2.5"/>
    <text x="246" y="64" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">✓</text>
  </g>
  <!-- Model Confidence Pill -->
  <g transform="translate(190, 185)">
    <rect width="180" height="30" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <text x="14" y="20" fill="#34d399" font-family="'Inter', monospace" font-size="12" font-weight="600">Threat Ingest: 99.4% ML Acc</text>
  </g>
  <!-- Tag -->
  <g transform="translate(20, 20)">
    <rect width="170" height="24" rx="6" fill="rgba(192, 132, 252, 0.15)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1"/>
    <text x="10" y="16" fill="#c084fc" font-family="'Inter', monospace" font-size="11" font-weight="600">ML THREAT DETECTION</text>
  </g>
</svg>
