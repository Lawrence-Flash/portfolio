<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#101f42" />
      <stop offset="100%" stop-color="#050a18" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="orbitPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f355da" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#spaceGrad)" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5"/>
  <!-- Starfield & Grid -->
  <g opacity="0.3">
    <circle cx="50" cy="40" r="1.5" fill="#fff" />
    <circle cx="120" cy="80" r="1" fill="#fff" />
    <circle cx="280" cy="50" r="1.5" fill="#fff" />
    <circle cx="340" cy="110" r="1" fill="#fff" />
    <circle cx="70" cy="190" r="1" fill="#fff" />
    <circle cx="310" cy="190" r="1.5" fill="#fff" />
    <path d="M 0,160 Q 200,140 400,160" stroke="#00f2fe" stroke-width="0.8" fill="none" opacity="0.2" />
    <path d="M 0,190 Q 200,170 400,190" stroke="#00f2fe" stroke-width="0.8" fill="none" opacity="0.15" />
  </g>
  <!-- Orbit Ring -->
  <ellipse cx="200" cy="120" rx="140" ry="45" fill="none" stroke="url(#orbitPurple)" stroke-width="2" stroke-dasharray="6 4" transform="rotate(-18 200 120)" opacity="0.7"/>
  <!-- Central Satellite Graphic -->
  <g transform="translate(160, 80)">
    <!-- Solar Panels -->
    <rect x="-45" y="16" width="35" height="24" rx="2" fill="#0c2340" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="-33" y1="16" x2="-33" y2="40" stroke="#00f2fe" stroke-width="1" />
    <line x1="-21" y1="16" x2="-21" y2="40" stroke="#00f2fe" stroke-width="1" />
    
    <rect x="85" y="16" width="35" height="24" rx="2" fill="#0c2340" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="97" y1="16" x2="97" y2="40" stroke="#00f2fe" stroke-width="1" />
    <line x1="109" y1="16" x2="109" y2="40" stroke="#00f2fe" stroke-width="1" />

    <!-- Connection bars -->
    <line x1="-10" y1="28" x2="10" y2="28" stroke="#4facfe" stroke-width="2" />
    <line x1="65" y1="28" x2="85" y2="28" stroke="#4facfe" stroke-width="2" />

    <!-- Satellite Body -->
    <rect x="10" y="8" width="55" height="40" rx="6" fill="#1b2a4a" stroke="#fff" stroke-width="2"/>
    <circle cx="37" cy="28" r="8" fill="url(#neonCyan)" />
    
    <!-- Antenna Dish & Transmit Waves -->
    <path d="M 37,48 L 37,62" stroke="#4facfe" stroke-width="2"/>
    <path d="M 22,64 C 28,72 46,72 52,64" stroke="#00f2fe" stroke-width="2.5" fill="none"/>
    <circle cx="37" cy="72" r="3" fill="#f355da"/>
    <!-- Signal Beams -->
    <path d="M 25,82 A 15 15 0 0 0 49,82" stroke="#f355da" stroke-width="1.5" fill="none" opacity="0.8"/>
    <path d="M 18,90 A 25 25 0 0 0 56,90" stroke="#00f2fe" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  <!-- Security Shield & Terminal Tag -->
  <g transform="translate(20, 20)">
    <rect width="130" height="24" rx="6" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1"/>
    <text x="10" y="16" fill="#00f2fe" font-family="'Inter', monospace" font-size="11" font-weight="600">SATCOM / CCSDS SEC</text>
  </g>
</svg>
