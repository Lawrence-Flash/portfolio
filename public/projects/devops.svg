    <text x="60" y="16" fill="#fed7aa" font-family="'Courier New', monospace" font-size="11" font-weight="600">lawrence@infra-gateway:~$</text>

    <!-- Terminal commands -->
    <text x="18" y="48" fill="#fb923c" font-family="'Courier New', monospace" font-size="12">root@srv:~# ./deploy_ha_cluster.sh --env=prod</text>
